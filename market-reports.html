<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Reports Archive — YARCOBR</title>
    <meta
      name="description"
      content="Browse the full archive of monthly YARCOBR market reports."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <div class="page-header">
      <div class="container">
        <h1>Market Reports</h1>
        <p>Browse our archive of monthly market reports.</p>
      </div>
    </div>

    <div class="container section">
      <div class="card-grid" id="report-grid"></div>
      <div class="older-reports-note">
        <button class="btn btn-secondary" disabled>
          Older reports coming soon
        </button>
      </div>
    </div>

    <div id="site-footer"></div>

    <script src="js/reports-data.js"></script>
    <script src="js/components.js"></script>
    <script>
      renderHeader("reports");
      renderFooter();

      const grid = document.getElementById("report-grid");
      grid.innerHTML = REPORTS.map(function (r) {
        return `
      <div class="report-card">
        <div class="report-cover">
          <span class="cover-brand">YARCOBR</span>
          <span class="cover-sub">Market Report</span>
          <span class="cover-month">${r.title}</span>
        </div>
        <div class="report-card-body">
          <h3>${r.title}</h3>
          <p>${r.excerpt}</p>
          <div class="report-card-actions">
            <a href="report.html?month=${r.slug}" class="btn btn-primary btn-block">View Online →</a>
            <a href="${r.pdf}" class="btn btn-secondary btn-block" download>Download PDF</a>
          </div>
        </div>
      </div>
    `;
      }).join("");
    </script>
  </body>
</html>
