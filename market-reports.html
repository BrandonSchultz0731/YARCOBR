<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Reports Archive — YARCOBR</title>
    <meta
      name="description"
      content="Browse the full archive of monthly YARCOBR market reports."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <div class="page-header">
      <div class="container">
        <h1>Market Reports</h1>
        <p>Browse our archive of monthly market reports.</p>
      </div>
    </div>

    <div class="container section">
      <div class="list-controls" id="list-controls" style="display: none">
        <input
          type="search"
          class="search-input"
          id="search-input"
          placeholder='Search reports (e.g. "August" or "2026")'
        />
        <div>
          <label for="sort-select">Sort by:</label>
          <select id="sort-select">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>
      </div>
      <div class="card-grid" id="report-grid"></div>
      <p
        id="empty-state"
        style="display: none; text-align: center; color: var(--color-ink-muted)"
      >
        No reports have been published yet — check back soon.
      </p>
      <p
        id="no-match-state"
        style="display: none; text-align: center; color: var(--color-ink-muted)"
      >
        No reports match your search.
      </p>
    </div>

    <div id="site-footer"></div>

    <script src="js/reports-loader.js"></script>
    <script src="js/components.js"></script>
    <script>
      renderHeader("reports");
      renderFooter();

      loadReports().then(function (reports) {
        const grid = document.getElementById("report-grid");
        const emptyState = document.getElementById("empty-state");
        const noMatchState = document.getElementById("no-match-state");
        const controls = document.getElementById("list-controls");
        const searchInput = document.getElementById("search-input");
        const sortSelect = document.getElementById("sort-select");

        if (!reports.length) {
          emptyState.style.display = "block";
          return;
        }

        controls.style.display = "flex";

        function render() {
          const query = searchInput.value.trim().toLowerCase();
          let list = reports.filter(function (r) {
            return (
              r.title.toLowerCase().includes(query) || r.slug.includes(query)
            );
          });

          // reports[] arrives newest-first from reports.json; reverse for oldest-first
          if (sortSelect.value === "oldest") list = list.slice().reverse();

          if (!list.length) {
            grid.innerHTML = "";
            noMatchState.style.display = "block";
            return;
          }
          noMatchState.style.display = "none";

          grid.innerHTML = list
            .map(function (r) {
              // The month is the card's title — it is not repeated in the
              // body, and the generic excerpt is omitted here because it is
              // identical on every report and reads as filler in a grid.
              return `
          <div class="report-card">
            <div class="report-cover">
              <span class="cover-sub">YARCOBR Market Report</span>
              <span class="cover-month">${r.title}</span>
            </div>
            <div class="report-card-body">
              <div class="report-card-actions">
                <a href="/report?month=${r.slug}" class="btn btn-primary btn-block">View Online →</a>
                <a href="${r.pdf}" class="btn btn-secondary btn-block" download>Download PDF</a>
              </div>
            </div>
          </div>
        `;
            })
            .join("");
        }

        searchInput.addEventListener("input", render);
        sortSelect.addEventListener("change", render);
        render();
      });
    </script>
  </body>
</html>
