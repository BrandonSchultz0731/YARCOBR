name: Update Report Index

# Runs automatically whenever a file in /reports is added, renamed, or removed.
# No one needs to trigger this manually for normal use — uploading a
# correctly named PDF through the GitHub website is enough. workflow_dispatch
# below adds a manual "Run workflow" button in the Actions tab, useful for
# edge cases like recovering from a force-push (see repo README).
on:
  push:
    branches: [main]
    paths:
      - "reports/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Generate reports.json from /reports folder
        run: node scripts/generate-reports-json.js

      - name: Commit updated reports.json (if changed)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update reports.json"
          file_pattern: reports.json
