<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Report — YARCOBR</title>
    <meta name="theme-color" content="#06242b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=IBM+Plex+Mono:wght@500&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="js/motion.js"></script>
  </head>
  <body>
    <div id="site-header"></div>

    <main id="main">
      <section class="page-head">
        <div class="contours" aria-hidden="true"></div>
        <div class="container">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="/">Home</a>
            <span class="sep" aria-hidden="true">/</span>
            <a href="/market-reports">Market Reports</a>
            <span class="sep" aria-hidden="true">/</span>
            <span id="crumb-current">Report</span>
          </nav>
          <div id="report-content"></div>
        </div>
      </section>

      <section class="band">
        <div class="container" id="report-body"></div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/reports-loader.js"></script>
    <script src="js/components.js"></script>
    <script>
      renderHeader("reports");
      renderFooter();

      const headerMount = document.getElementById("report-content");
      const bodyMount = document.getElementById("report-body");

      loadReports().then(function (reports) {
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("month");
        const report = slug ? findReport(reports, slug) : reports[0];

        if (!report) {
          document.getElementById("crumb-current").textContent = "Not found";
          headerMount.innerHTML = `<h1>Report not found</h1><p>We couldn't find that report.</p>`;
          bodyMount.innerHTML = `
        <div class="notice">
          <p>The report you're looking for may have been moved, or the link may be incorrect.</p>
          <a href="/market-reports" class="btn btn-primary">Browse all reports<span class="arrow" aria-hidden="true">→</span></a>
        </div>
      `;
          return;
        }

        document.title = report.title + " Market Report — YARCOBR";
        document.getElementById("crumb-current").textContent = report.title;

        headerMount.innerHTML = `
      <div class="report-hero">
        <!-- No value on this one. The breadcrumb above it and the h1 below it
             both already say the month, and three of them in 80px reads as a
             mistake rather than emphasis. -->
        <div class="rule">
          <span class="rule-label">Market report</span>
          <span class="rule-line" aria-hidden="true"></span>
        </div>
        <h1>${report.title}</h1>
        <p>${report.excerpt}</p>
        <div class="actions">
          <a href="${report.pdf}" class="btn btn-gold" download>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Download PDF
          </a>
          <a href="/market-reports" class="btn btn-ghost">← Back to reports</a>
        </div>
      </div>
    `;

        const adjacent = getAdjacent(reports, report.slug);
        const newerLink = adjacent.newer
          ? `<a href="/report?month=${adjacent.newer.slug}">${adjacent.newer.title} →</a>`
          : `<span class="disabled">Newest report</span>`;
        const olderLink = adjacent.older
          ? `<a href="/report?month=${adjacent.older.slug}">← ${adjacent.older.title}</a>`
          : `<span class="disabled">Oldest report</span>`;

        bodyMount.innerHTML = `
      <embed src="${report.pdf}" type="application/pdf" class="pdf-frame" />
      <div class="report-nav">
        ${olderLink}
        ${newerLink}
      </div>
    `;
      });
    </script>
  </body>
</html>
